<!DOCTYPE html>
<html lang="es" data-bs-theme="light" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito - Hakai</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="min-vh-100 d-flex flex-column">
    <nav th:replace="~{fragments/layout :: navbar('carrito')}"></nav>
    <main class="flex-grow-1 py-4 carrito-page"><div class="container">
        <nav aria-label="Ruta de navegación"><ol class="breadcrumb small mb-2"><li class="breadcrumb-item"><a href="/catalogo">Inicio</a></li><li class="breadcrumb-item active">Carrito</li></ol></nav>
        <h1 class="h3 fw-bold mb-4"><i class="bi bi-cart3 me-2"></i>Tu carrito</h1>
        <div th:if="${errorCarrito}" class="alert alert-danger" th:text="${errorCarrito}"></div>
        <div th:if="${pedidoId}" class="alert alert-success">Compra realizada. Pedido: <strong th:text="${pedidoId}"></strong></div>
        <div th:if="${carritoVacio}" class="card border-0 shadow-sm"><div class="card-body text-center py-5"><i class="bi bi-cart-x display-3 text-secondary"></i><h2 class="h5 fw-bold mt-3">Tu carrito está vacío</h2><p class="text-secondary">Agrega suscripciones desde el catálogo para verlas aquí.</p><a href="/catalogo" class="btn btn-primary"><i class="bi bi-grid-3x3-gap me-1"></i>Ir al catálogo</a></div></div>
        <div th:unless="${carritoVacio}" class="row g-4">
            <div class="col-lg-8"><div class="card border-0 shadow-sm"><div class="table-responsive"><table class="table align-middle mb-0"><thead class="table-light"><tr class="small text-secondary"><th class="ps-4">Producto</th><th>Precio</th><th class="text-center">Cantidad</th><th>Subtotal</th><th></th></tr></thead><tbody>
                <tr th:each="item : ${carritoItems}"><td class="ps-4 py-3"><div class="d-flex align-items-center gap-3"><img class="portada-mini rounded-3 object-fit-cover" th:src="${item.suscripcion.imagenUrl}" th:alt="${item.suscripcion.nombre}"><div><div class="fw-semibold" th:text="${item.suscripcion.nombre}"></div><div class="small text-secondary" th:text="${item.suscripcion.tipo + ' · ' + item.suscripcion.duracion}"></div><div class="small text-secondary" th:text="'Stock disponible: ' + ${item.suscripcion.stock}"></div></div></div></td><td class="text-nowrap" th:text="'S/ ' + ${#numbers.formatDecimal(item.suscripcion.precio, 1, 2)}"></td><td><div class="input-group input-group-sm grupo-cantidad mx-auto"><form th:action="@{/carrito/cantidad}" method="post"><input type="hidden" name="id" th:value="${item.suscripcion.id}"><input type="hidden" name="cambio" value="-1"><button class="btn btn-outline-secondary" type="submit" aria-label="Quitar uno"><i class="bi bi-dash"></i></button></form><input type="text" class="form-control text-center" th:value="${item.cantidad}" readonly><form th:action="@{/carrito/cantidad}" method="post"><input type="hidden" name="id" th:value="${item.suscripcion.id}"><input type="hidden" name="cambio" value="1"><button class="btn btn-outline-secondary" type="submit" th:disabled="${item.cantidad >= item.suscripcion.stock}" aria-label="Agregar uno"><i class="bi bi-plus"></i></button></form></div></td><td class="fw-semibold text-nowrap" th:text="'S/ ' + ${#numbers.formatDecimal(item.subtotal, 1, 2)}"></td><td class="pe-4"><form th:action="@{/carrito/eliminar}" method="post"><input type="hidden" name="id" th:value="${item.suscripcion.id}"><button type="submit" class="btn btn-sm btn-outline-danger" aria-label="Eliminar"><i class="bi bi-trash"></i></button></form></td></tr>
            </tbody></table></div><div class="card-footer bg-white d-flex justify-content-between py-3 px-4"><a href="/catalogo" class="btn btn-link px-0"><i class="bi bi-arrow-left me-1"></i>Seguir comprando</a><form th:action="@{/carrito/vaciar}" method="post"><button type="submit" class="btn btn-outline-danger btn-sm"><i class="bi bi-trash me-1"></i>Vaciar carrito</button></form></div></div></div>
            <div class="col-lg-4"><div class="card border-0 shadow-sm sticky-lg-top resumen-fijo"><div class="card-body p-4"><h2 class="h5 fw-bold mb-3">Resumen del pedido</h2><div class="d-flex justify-content-between small mb-2"><span class="text-secondary">Productos (<span th:text="${cantidadTotal}">0</span>)</span><span th:text="'S/ ' + ${#numbers.formatDecimal(totalCarrito, 1, 2)}"></span></div><div class="d-flex justify-content-between small mb-2"><span class="text-secondary">Descuento</span><span class="text-success">- S/ 0.00</span></div><hr><div class="d-flex justify-content-between align-items-center mb-1"><span class="fw-bold">Total</span><span class="fs-4 fw-bold text-primary" th:text="'S/ ' + ${#numbers.formatDecimal(totalCarrito, 1, 2)}"></span></div><p class="small text-secondary mb-3">Precios en soles, IGV incluido.</p><form th:action="@{/carrito/comprar}" method="post" class="d-grid"><button type="submit" class="btn btn-primary btn-lg"><i class="bi bi-lock-fill me-1"></i>Finalizar compra</button></form></div></div></div>
        </div>
    </div></main>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
