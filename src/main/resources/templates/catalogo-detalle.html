<!DOCTYPE html>
<html lang="es" data-bs-theme="light" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Detalle de suscripcion</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="min-vh-100 d-flex flex-column">
    <nav th:replace="~{fragments/layout :: navbar('catalogo')}"></nav>
    <main class="container flex-grow-1 py-5" th:if="${suscripcion != null}">
        <a class="btn btn-link px-0 mb-4" href="/catalogo"><i class="bi bi-arrow-left me-1"></i>Volver al catalogo</a>
        <div class="row g-4 align-items-center">
            <div class="col-lg-5">
                <img class="img-fluid rounded-4 shadow-sm w-100" th:src="${suscripcion.imagenUrl}" th:alt="${suscripcion.nombre}">
            </div>
            <div class="col-lg-7">
                <span class="badge text-bg-primary mb-2" th:text="${suscripcion.categoria}"></span>
                <h1 class="display-6 fw-bold" th:text="${suscripcion.nombre}"></h1>
                <p class="lead text-secondary" th:text="${suscripcion.descripcion}"></p>
                <div class="d-flex flex-wrap gap-2 mb-4">
                    <span class="badge text-bg-light" th:text="${suscripcion.tipo}"></span>
                    <span class="badge text-bg-light" th:text="${suscripcion.duracion}"></span>
                    <span class="badge text-bg-light" th:text="'Stock disponible: ' + ${suscripcion.stock}"></span>
                </div>
                <div class="fs-2 fw-bold text-primary mb-3" th:text="'S/ ' + ${#numbers.formatDecimal(suscripcion.precio, 1, 2)}"></div>
                <form th:action="@{/carrito/agregar}" method="post"><input type="hidden" name="id" th:value="${suscripcion.id}"><input type="hidden" name="returnUrl" th:value="@{'/catalogo/detalles/' + ${suscripcion.id}}"><button class="btn btn-primary btn-lg" type="submit" th:disabled="${suscripcion.stock == 0}"><i class="bi bi-cart-plus me-2"></i>Comprar</button></form>
            </div>
        </div>
    </main>
    <main class="container flex-grow-1 py-5" th:unless="${suscripcion != null}">
        <div class="alert alert-danger">Suscripcion no encontrada.</div>
    </main>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
