<!DOCTYPE html>
<html lang="es" data-bs-theme="light" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Detalle de suscripcion</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="min-vh-100 d-flex flex-column">
    <nav th:replace="~{fragments/layout :: navbar('catalogo')}"></nav>
    <main id="detalleContenido" class="container flex-grow-1 py-5 d-none">
        <a class="btn btn-link px-0 mb-4" href="/catalogo"><i class="bi bi-arrow-left me-1"></i>Volver al catalogo</a>
        <div class="row g-4 align-items-center">
            <div class="col-lg-5">
                <img id="detalleImagen" class="img-fluid rounded-4 shadow-sm w-100" src="" alt="">
            </div>
            <div class="col-lg-7">
                <span id="detalleCategoria" class="badge text-bg-primary mb-2"></span>
                <h1 id="detalleNombre" class="display-6 fw-bold"></h1>
                <p id="detalleDescripcion" class="lead text-secondary"></p>
                <div class="d-flex flex-wrap gap-2 mb-4">
                    <span id="detalleTipo" class="badge text-bg-light"></span>
                    <span id="detalleDuracion" class="badge text-bg-light"></span>
                    <span id="detalleStock" class="badge text-bg-light"></span>
                </div>
                <div id="detallePrecio" class="fs-2 fw-bold text-primary mb-3"></div>
                <button id="detalleComprar" class="btn btn-primary btn-lg"><i class="bi bi-cart-plus me-2"></i>Comprar</button>
            </div>
        </div>
    </main>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/productos.js}"></script>
    <script th:src="@{/js/carrito.js}"></script>
    <script th:src="@{/js/detalle.js}"></script>
</body>
</html>
