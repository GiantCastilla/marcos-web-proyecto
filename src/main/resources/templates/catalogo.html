<!DOCTYPE html>
<html lang="es" data-bs-theme="light" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo - Hakai</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="min-vh-100 d-flex flex-column">
    <nav th:replace="~{fragments/layout :: navbar('catalogo')}"></nav>
    <main class="flex-grow-1 py-4">
        <div class="container">
            <div id="bannerOfertas" class="carousel slide mb-4 rounded-4 overflow-hidden shadow-sm" data-bs-ride="carousel">
                <div class="carousel-inner">
                    <a th:each="producto, estado : ${ofertas}"
                       th:href="@{'/catalogo/detalles/' + ${producto.id}}"
                       th:class="${estado.index == 0 ? 'carousel-item active banner-slide banner-azul text-decoration-none' : 'carousel-item banner-slide banner-verde text-decoration-none'}">
                        <div class="h-100 d-flex align-items-center px-4 px-md-5">
                            <div class="row w-100 align-items-center">
                                <div class="col-md-8 text-white">
                                    <span class="badge bg-warning text-dark mb-2" th:text="${'-' + producto.porcentajeDescuento + '% DESCUENTO'}"></span>
                                    <h2 class="display-6 fw-bold mb-2" th:text="${producto.nombre}"></h2>
                                    <p class="mb-3 opacity-75" th:text="${producto.descripcion}"></p>
                                </div>
                                <div class="col-md-4 d-none d-md-block text-center">
                                    <img class="banner-imagen" th:src="${producto.imagenUrl}" th:alt="${producto.nombre}">
                                </div>
                            </div>
                        </div>
                    </a>
                </div>
                <button class="carousel-control-prev" type="button" data-bs-target="#bannerOfertas" data-bs-slide="prev"><span class="carousel-control-prev-icon"></span><span class="visually-hidden">Anterior</span></button>
                <button class="carousel-control-next" type="button" data-bs-target="#bannerOfertas" data-bs-slide="next"><span class="carousel-control-next-icon"></span><span class="visually-hidden">Siguiente</span></button>
            </div>

            <nav aria-label="Ruta de navegación"><ol class="breadcrumb small mb-2"><li class="breadcrumb-item"><a href="/catalogo">Inicio</a></li><li class="breadcrumb-item active">Suscripciones de IA</li></ol></nav>
            <h1 class="h3 fw-bold mb-4">Suscripciones de IA</h1>
            <div class="row g-4">
                <aside class="col-lg-3">
                    <div class="card border-0 shadow-sm"><div class="card-body">
                        <div class="d-flex justify-content-between align-items-center mb-3"><h2 class="h6 fw-bold mb-0"><i class="bi bi-funnel me-1"></i>Filtros</h2><a class="btn btn-link btn-sm p-0" href="/catalogo">Limpiar</a></div>
                        <form action="/catalogo" method="get">
                            <label for="filtroOrden" class="form-label small fw-semibold">Ordenar por</label>
                            <select id="filtroOrden" name="orden" class="form-select mb-4">
                                <option value="relevancia" th:selected="${ordenSeleccionado == 'relevancia'}">Relevancia</option>
                                <option value="precio-asc" th:selected="${ordenSeleccionado == 'precio-asc'}">Precio: más bajo primero</option>
                                <option value="precio-desc" th:selected="${ordenSeleccionado == 'precio-desc'}">Precio: más alto primero</option>
                            </select>
                            <input type="hidden" name="q" th:value="${busqueda}">
                            <p class="form-label small fw-semibold mb-2">Modelo de IA</p>
                            <label class="form-check"><input class="form-check-input" type="radio" name="modelo" value="todos" th:checked="${modeloSeleccionado == 'todos'}"><span class="form-check-label">Todos</span></label>
                            <label class="form-check" th:each="modelo : ${modelos}"><input class="form-check-input" type="radio" name="modelo" th:value="${modelo}" th:checked="${modeloSeleccionado == modelo}"><span class="form-check-label" th:text="${modelo}"></span></label>
                            <button class="btn btn-primary btn-sm w-100 mt-4" type="submit">Aplicar filtros</button>
                        </form>
                    </div></div>
                </aside>
                <section class="col-lg-9">
                    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3"><span class="text-secondary" th:text="${suscripciones.size() + (suscripciones.size() == 1 ? ' artículo' : ' artículos')}"></span><span class="badge text-bg-primary" th:if="${!busqueda.isBlank()}" th:text="'Resultados para: ' + ${busqueda}"></span></div>
                    <div th:if="${suscripciones.isEmpty()}" class="text-center py-5"><i class="bi bi-search display-4 text-secondary"></i><p class="mt-3 mb-2 fw-semibold">No encontramos suscripciones con esos filtros.</p><a class="btn btn-outline-primary btn-sm" href="/catalogo">Ver todo el catálogo</a></div>
                    <div class="row row-cols-1 row-cols-sm-2 row-cols-xl-3 g-3">
                        <div class="col" th:each="producto : ${suscripciones}" th:id="${'producto-' + producto.id}"><div class="card h-100 border-0 shadow-sm tarjeta-producto">
                            <div class="portada position-relative"><img class="w-100 h-100 object-fit-cover" th:src="${producto.imagenUrl}" th:alt="${producto.nombre}"></div>
                            <div class="card-body d-flex flex-column"><h3 class="card-title h6 fw-bold mb-1" th:text="${producto.nombre}"></h3><p class="small text-secondary mb-2" th:text="${producto.tipo + ' · ' + producto.duracion}"></p>
                                <p class="small fw-semibold text-danger mb-2" th:if="${producto.stock == 0}"><i class="bi bi-x-circle me-1"></i>Agotado</p><p class="small fw-semibold text-warning mb-2" th:if="${producto.stock > 0 && producto.stock <= 5}" th:text="'¡Solo quedan ' + ${producto.stock} + '!'"></p><p class="small fw-semibold text-success mb-2" th:if="${producto.stock > 5}" th:text="'Stock: ' + ${producto.stock} + ' disponibles'"></p>
                                <div class="mt-auto"><div class="fs-5 fw-bold text-primary mb-2" th:text="'S/ ' + ${#numbers.formatDecimal(producto.precio, 1, 2)}"></div><div class="d-grid gap-2"><form th:action="@{/carrito/agregar}" method="post"><input type="hidden" name="id" th:value="${producto.id}"><input type="hidden" name="returnUrl" th:value="@{/catalogo(q=${busqueda},modelo=${modeloSeleccionado},orden=${ordenSeleccionado})}"><input type="hidden" name="anchor" th:value="${'producto-' + producto.id}"><button type="submit" class="btn btn-primary btn-sm w-100" th:disabled="${producto.stock == 0}"><i class="bi bi-cart-plus me-1"></i>Añadir al carrito</button></form><a th:href="@{'/catalogo/detalles/' + ${producto.id}}" class="btn btn-outline-primary btn-sm"><i class="bi bi-arrow-up-right me-1"></i>Ver detalle</a></div></div>
                            </div>
                        </div></div>
                    </div>
                </section>
            </div>
        </div>
    </main>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
